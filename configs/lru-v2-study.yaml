# Testbed v2 three-arm study: settings of configs/soclaas-pilot.yaml (the frozen final protocol's
# model, prompts, budgets, 2,000-note workload, epsilon 0.08) on baseline research/baseline-v2.
# phase is 'smoke' only because the controller caps 'pilot' at 10 iterations and 'final' requires the
# two-arm frozen protocol; this is a separate, not-pre-registered three-arm study.
# LRU capacity K = 6 (see research/testbed-v2/README.md).
schema_version: 1
phase: smoke
epsilon: 0.08
baseline: research/baseline-v2
model: default
reasoning: none
image: sha256:b5ab7123fadb36abfa68da75d1e7c6e6edc789a9370dcf24f4c8411b327fbe2e
agent_network: bridge
benchmark:
  seed: 7
  note_count: 2000
  cycles: 100
  repetitions: 5
  warmups: 2
  concurrency: 1
  timeout_seconds: 5.0
  startup_timeout_seconds: 15.0
role_timeout_seconds: 300
evaluation_timeout_seconds: 300
max_input_bytes: 200000
max_output_bytes: 1000000
max_tool_calls: 0
repair_budget: 0
role_retries: 0
checkpoints:
- 10
- 15
- 20
- 25
- 30
replicates: 1
provider_base_url: https://soclaas-api.comp.nus.edu.sg/v1
provider_key_env: SOCLAAS_API_KEY
max_response_tokens: 12000
temperature: 0.2
input_token_limit: 200000
