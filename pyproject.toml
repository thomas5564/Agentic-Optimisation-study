[project]
name = "comp-690-notes"
version = "0.1.0"
description = "Baseline notes API for the COMP 690 research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pytest==8.4.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
analysis = ["matplotlib==3.11.2"]

[tool.setuptools]
packages = ["app", "benchmarks", "agents", "controller", "analysis"]

[tool.setuptools.package-data]
app = ["static/*"]
agents = ["prompts/*.txt", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
