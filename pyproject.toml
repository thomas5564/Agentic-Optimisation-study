[project]
name = "comp-690-notes"
version = "0.1.0"
description = "Baseline notes API for the COMP 690 research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pytest>=8,<9",
  "PyYAML>=6.0,<7.0",
]

[tool.setuptools]
packages = ["app", "benchmarks"]

[tool.pytest.ini_options]
pythonpath = ["."]
